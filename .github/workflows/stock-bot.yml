name: Stock Alert Bot

on:
  schedule:
    # Every 5 minutes, 13:00-21:59 UTC, Mon-Fri.
    # This window safely covers US market hours (9:30-16:00 America/New_York)
    # across both EDT and EST; the script itself double-checks the exact
    # market-open window before doing any work, so runs outside real market
    # hours just exit immediately (and don't use any Twelve Data credits).
    # NOTE: GitHub's scheduler can occasionally lag a few minutes during
    # high load -- 5 minutes is close to the practical minimum, not a hard
    # guarantee.
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated state.json

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot (single pass)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          RUN_MODE: once
        run: python telegram_stock_alert_bot.py

      - name: Save alert-cooldown state
        run: |
          git config user.name "stock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Update alert state [skip ci]"
          git push
