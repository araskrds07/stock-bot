name: Stock Alert Bot

on:
  schedule:
    # Two schedules combined cover the full pre-market -> regular -> after-hours
    # window (4:00-20:00 America/New_York), across both EDT and EST, without
    # relying on a single UTC hour range that would wrap awkwardly past midnight.
    # The script itself re-checks the exact session and throttles extended-hours
    # activity to stay inside the free Twelve Data quota — see the script's
    # docstring for the math. Runs outside any real session just exit immediately
    # (no Twelve Data credits used).
    - cron: "*/5 8-23 * * 1-5"   # covers ~4:00-19:59 ET (premarket+regular+most of afterhours)
    - cron: "*/5 0-1 * * 2-6"    # covers the after-hours tail that spills past midnight UTC
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated state.json

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot (single pass)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          RUN_MODE: once
          # Manual "Run workflow" clicks always do a real check (bypassing the
          # extended-hours quota throttle), so testing isn't at the mercy of
          # which minute you happened to click. Scheduled runs still throttle.
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: python telegram_stock_alert_bot.py

      - name: Save bot state (alert cooldowns + today's watchlist)
        run: |
          git config user.name "stock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json daily_watchlist.json
          git diff --quiet --cached || git commit -m "Update bot state [skip ci]"
          git push
