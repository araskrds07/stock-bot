name: Stock Alert Bot

on:
  schedule:
    # Hafta içi her 5 dakikada bir. İki satır birlikte New York saatiyle
    # 04:00-20:00 aralığını (pre-market + normal seans + after-hours) hem yaz
    # hem kış saatinde kapsar. Bot seansı kendisi kontrol eder; piyasa
    # kapalıysa birkaç saniyede hiçbir şey yapmadan çıkar.
    - cron: "*/5 8-23 * * 1-5"
    - cron: "*/5 0-1 * * 2-6"
  workflow_dispatch:      # Actions sekmesinden elle çalıştırma
    inputs:
      mode:
        description: "normal = durum mesajı · backtest = son 2 ayın gerçek veriyle testi"
        type: choice
        options: [normal, backtest]
        default: normal

permissions:
  contents: write         # state.json ve daily_watchlist.json'ı kaydetmek için

concurrency:              # iki çalıştırma üst üste binip aynı sinyali iki kez göndermesin
  group: stock-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot (single pass)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          ACCOUNT_SIZE: ${{ vars.ACCOUNT_SIZE }}
          RISK_PER_TRADE_PCT: ${{ vars.RISK_PER_TRADE_PCT }}
          RUN_MODE: ${{ github.event.inputs.mode == 'backtest' && 'backtest' || 'once' }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: python telegram_stock_alert_bot.py

      - name: Save bot state
        if: always()
        run: |
          git config user.name "stock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json daily_watchlist.json
          if git diff --quiet --cached; then exit 0; fi
          git commit -m "Update bot state [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          echo "State could not be pushed" && exit 1
